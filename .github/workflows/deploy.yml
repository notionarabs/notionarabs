name: Deploy to EC2 - Optimized

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Overall job timeout
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      timeout-minutes: 10  # SSH action timeout
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 30s
        command_timeout: 8m
        script: |
          set -e  # Exit on any error
          
          echo "🚀 Starting optimized deployment..."
          echo "📅 Date: $(date)"
          echo "⏱️  Timeout: 8 minutes max"
          
          # Navigate to project directory (create if doesn't exist)
          if [ ! -d "~/notion-arabs" ]; then
            echo "📁 Cloning repository..."
            cd ~
            git clone --depth 1 https://github.com/hazemyasserprg/notion-arabs.git
          fi
          
          cd ~/notion-arabs
          echo "📂 Current directory: $(pwd)"
          
          # Fast git operations
          echo "📥 Updating repository..."
          git fetch --depth 1 origin main
          git reset --hard origin/main
          
          # Navigate to backend
          cd backend
          echo "📂 Backend directory: $(pwd)"
          
          # Check if deploy script exists
          if [ ! -f "deploy.sh" ]; then
            echo "❌ deploy.sh not found!"
            exit 1
          fi
          
          # Run optimized deployment script
          echo "🔧 Running optimized deployment script..."
          chmod +x deploy.sh
          timeout 6m ./deploy.sh
          
          echo "✅ Deployment completed successfully!"
          
          # Quick verification
          echo "🔍 Quick verification..."
          pm2 status | head -5
          
    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi